services:
  - type: web
    name: syntecxhub-chat-application
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: relay-postgres
          property: connectionString
databases:
  - name: relay-postgres
    databaseName: relay
    user: relay
    region: oregon
    plan: free
    ipAllowList: []
