services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local_only
      POSTGRES_DB: relay
    volumes:
      - relay-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  relay-postgres-data:
